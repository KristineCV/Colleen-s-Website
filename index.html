<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colleen's Cakes & Pastries homepage</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Sedan+SC&display=swap" rel="stylesheet"> <!-- Importing Roboto and Sedan SC fonts -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <header>
    <div class="header-content">
      
      <div class="logo">
        <img src="logo.png" alt="Colleen's Logo">
      </div>
      
      <nav>
        <ul>
          <li><a href="#">HOME</a></li>
          <li><a href="#">MENU</a></li>
          <li><a href="#">ABOUT US</a></li>
          <li><a href="#">FAQS</a></li>
        </ul>
      </nav>
      
      <div class="action-columns">
        
        <div class="social-row">
          <a href="#"><img src="facebook.png" alt="Facebook"></a>
          <a href="#"><img src="instagram-icon.png" alt="Instagram"></a>
          <a href="#"><img src="tiktok-icon.jpg" alt="TikTok"></a>
          <span>@colleenscakesandpastries</span>
          <a href="mailto:colleenscakesandpastries@gmail.com">
            <img src="gmail-icon.png" alt="Email Icon">
          </a>
          <span>colleenscakesandpastries@gmail.com</span>
        </div>
        
        <div class="buttons">
          <button>SIGN UP</button>
          <button>LOGIN</button>
        </div>
      </div>
    </div>
  </header>
 
  <div class="banner">
      <div class="left-content">
        <h1>COLLEEN'S</h1>
        <h3>CAKES & PASTRIES</h3>
        <button class="order-btn">ORDER</button>
      </div>
      <div class="right-images">
        <img src="banner-cake.png" alt = "Cake banner">
      </div>
    </div>
  
  <section class="tagline">
    <h2>Home of freshly baked cake & pastries</h2>
    
  </section>
  
  <section class="categories">
    <div class="category-item">
      <img src="best-sellers.png" alt="Best Sellers">
      <p>BEST SELLERS</p>
    </div>
    <div class="category-item">
      <img src="cupcakes.png" alt="Cupcakes">
      <p>CUPCAKES</p>
    </div>
    <div class="category-item">
      <img src="custom-cakes.png" alt="Custom Cakes">
      <p>CUSTOM CAKES</p>
    </div>
    <div class="category-item">
      <img src="pastries.png" alt="Pastries">
      <p>PASTRIES</p>
    </div>
    <div class="category-item">
      <img src="holiday-cakes.png" alt="Holiday Cakes">
      <p>HOLIDAY CAKES</p>
    </div>
  </section>

  <script src="homepage.js"></script>

</body>
</html>
